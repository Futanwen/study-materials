<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HGhub · study-materials 资源门户</title>
<style>
  :root {
    --bg: #101010;
    --sidebar: #171717;
    --card: #1f1f1f;
    --card-hover: #292929;
    --line: #2e2e2e;
    --text: #ededed;
    --text-2: #a3a3a3;
    --text-3: #6b7280;
    --accent: #2d7ff0;
    --accent-soft: rgba(45, 127, 240, .16);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 14px;
    line-height: 1.55;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

  .layout { display: flex; min-height: 100vh; }

  /* ===== 侧边栏 ===== */
  .sidebar {
    width: 248px;
    flex: 0 0 248px;
    background: var(--sidebar);
    border-right: 1px solid var(--line);
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #38bdf8, #2d7ff0);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #fff; flex: 0 0 auto;
  }
  .brand-name { font-size: 17px; font-weight: 600; letter-spacing: .2px; }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: #262626; border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px;
  }
  .search svg { flex: 0 0 auto; opacity: .6; }
  .search input {
    background: transparent; border: none; outline: none; color: var(--text);
    width: 100%; font-size: 14px; min-width: 0;
  }
  .search input::placeholder { color: var(--text-3); }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px; color: var(--text-2);
    width: 100%; text-align: left;
  }
  .nav-item:hover { background: #222; color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--text); }
  .nav-item.active .nav-ico { color: var(--accent); }
  .nav-ico { flex: 0 0 auto; }
  .nav-label { font-size: 14.5px; }
  .side-foot { margin-top: auto; padding: 0 6px; font-size: 12px; color: var(--text-3); }

  /* ===== 主区 ===== */
  .main { flex: 1; min-width: 0; padding: 28px 32px 60px; }
  .wrap { max-width: 1080px; margin: 0 auto; }

  .hero { margin-bottom: 28px; }
  .hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .hero h1 { font-size: 26px; font-weight: 700; letter-spacing: .3px; }
  .hero .repo-path { color: var(--text-3); font-size: 13px; margin-top: 4px; }
  .hero p.desc { color: var(--text-2); margin-top: 10px; max-width: 640px; }
  .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 10px; font-size: 14px;
    border: 1px solid var(--line); background: #222;
  }
  .btn:hover { background: #2c2c2c; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #1f6fdc; }
  .meta-row { display: flex; gap: 22px; margin-top: 16px; flex-wrap: wrap; }
  .meta { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; }
  .meta b { color: var(--text); font-weight: 600; }

  .section-title { display: flex; align-items: baseline; gap: 10px; margin: 30px 0 16px; }
  .section-title h2 { font-size: 19px; font-weight: 600; }
  .section-title .sub { color: var(--text-3); font-size: 13px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .card:hover { background: var(--card-hover); }
  .card-head { display: flex; align-items: center; gap: 12px; }
  .card-ico {
    width: 40px; height: 40px; border-radius: 11px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); color: var(--accent);
  }
  .card-head h3 { font-size: 15.5px; font-weight: 600; }
  .card-head .cnt { font-size: 12.5px; color: var(--text-3); }

  .file-list { display: flex; flex-direction: column; gap: 2px; }
  .file-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 8px; border-radius: 8px; min-width: 0;
  }
  .file-row:hover { background: #262626; }
  .file-ico { flex: 0 0 auto; opacity: .75; }
  .file-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .file-size { flex: 0 0 auto; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .file-acts { flex: 0 0 auto; display: flex; gap: 4px; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    color: var(--text-2);
  }
  .icon-btn:hover { background: #333; color: var(--text); }

  .release-banner {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; display: flex; flex-direction: column; gap: 14px;
  }
  .release-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .tag-pill {
    background: var(--accent-soft); color: var(--accent);
    padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
  }
  .release-time { color: var(--text-3); font-size: 13px; }
  .release-body { color: var(--text-2); white-space: pre-wrap; font-size: 13.5px; }

  .empty {
    border: 1px dashed var(--line); border-radius: var(--radius);
    padding: 34px 20px; text-align: center; color: var(--text-3);
  }
  .empty .t { font-size: 15px; color: var(--text-2); margin-bottom: 6px; }

  .state-line { color: var(--text-3); font-size: 13px; padding: 12px 0; }

  /* ===== 响应式 ===== */
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .layout { flex-direction: column; }
    .sidebar {
      width: 100%; flex: none; height: auto; position: static;
      border-right: none; border-bottom: 1px solid var(--line);
      padding: 14px; gap: 12px;
    }
    .nav { flex-direction: row; overflow-x: auto; }
    .nav-item { padding: 8px 10px; }
    .main { padding: 20px 16px 48px; }
    .grid { grid-template-columns: 1fr; }
    .hero h1 { font-size: 21px; }
  }
</style>
</head>
<body>
<div class="layout">

  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">Hj</div>
      <div class="brand-name">HGhub</div>
    </div>
    <label class="search">
      <svg class="nav-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="search" placeholder="搜索文件名…" autocomplete="off">
    </label>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-nav="home">
        <svg class="nav-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21V12h6v9"/></svg>
        <span class="nav-label">概览</span>
      </button>
      <button class="nav-item" data-nav="categories">
        <svg class="nav-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span class="nav-label">资源分类</span>
      </button>
      <button class="nav-item" data-nav="release">
        <svg class="nav-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span class="nav-label">发布版本</span>
      </button>
    </nav>
    <div class="side-foot" id="sideFoot">数据源：GitHub 公开接口</div>
  </aside>

  <!-- ===== 主区 ===== -->
  <main class="main">
    <div class="wrap" id="app"></div>
  </main>
</div>

<script>
(function () {
  "use strict";

  var REPO = "Futanwen/study-materials";
  var BRANCH = "main";
  var API = "https://api.github.com/repos/" + REPO;
  var RAW = "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH;
  var WEB = "https://github.com/" + REPO + "/blob/" + BRANCH;
  // 门户展示的顶层目录白名单（源码构建目录不在下载门户内展示）
  var SHOW_DIRS = ["rules", "docs", "public"];
  var DIR_DESC = {
    "rules": "分流规则与订阅配置",
    "docs": "项目文档与审计记录",
    "public": "站点公共资源"
  };

  var state = {
    meta: null,
    release: null,        // latest release 对象或 null
    dirs: {},             // dirName -> [item]
    dirsLoaded: {},
    nav: "home",
    query: ""
  };

  var app = document.getElementById("app");

  /* ---------- 工具 ---------- */
  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function fmtSize(n) {
    if (!n || n <= 0) return "—";
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / 1024 / 1024).toFixed(2) + " MB";
  }
  function fmtTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit" });
  }
  function extOf(name) {
    var i = name.lastIndexOf(".");
    return i >= 0 ? name.slice(i + 1).toLowerCase() : "";
  }
  function fileKind(name) {
    var e = extOf(name);
    if (e === "md") return "doc";
    if (e === "json") return "data";
    if (e === "list" || e === "srs" || e === "yaml" || e === "yml") return "rule";
    if (e === "png" || e === "svg" || e === "jpg" || e === "jpeg" || e === "webp") return "img";
    return "file";
  }

  function api(path) {
    return fetch(API + path, { headers: { "Accept": "application/vnd.github+json", "User-Agent": "hghub-portal" } })
      .then(function (res) {
        if (res.status === 404) return null;
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      });
  }

  /* ---------- 图标 ---------- */
  function ico(kind, size) {
    size = size || 16;
    var common = 'width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
    var paths = {
      doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/>',
      data: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
      rule: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h13M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="19" cy="18" r="2"/>',
      img: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L6 21"/>',
      file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
      folder: '<path d="M4 4h5l2 3h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>',
      download: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
      external: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'
    };
    return '<svg class="file-ico" ' + common + '>' + (paths[kind] || paths.file) + '</svg>';
  }

  /* ---------- 数据加载 ---------- */
  function loadMeta() {
    return api("").then(function (m) { state.meta = m; });
  }
  function loadRelease() {
    return api("/releases/latest").then(function (r) { state.release = r; });
  }
  function loadDir(name) {
    if (state.dirsLoaded[name]) return Promise.resolve();
    return api("/contents/" + encodeURIComponent(name)).then(function (items) {
      state.dirs[name] = Array.isArray(items) ? items : [];
      state.dirsLoaded[name] = true;
    });
  }
  function loadAllDirs() {
    return Promise.all(SHOW_DIRS.map(loadDir));
  }

  /* ---------- 渲染片段 ---------- */
  function encPath(p) {
    return p.split("/").map(encodeURIComponent).join("/");
  }
  function fileRow(item) {
    var name = item.name;
    var kind = fileKind(name);
    var size = item.size || 0;
    var rawUrl = RAW + "/" + encPath(item.path);
    var webUrl = WEB + "/" + encPath(item.path);
    return '<div class="file-row">' +
      ico(kind, 16) +
      '<span class="file-name" title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</span>' +
      '<span class="file-size">' + fmtSize(size) + '</span>' +
      '<span class="file-acts">' +
        '<a class="icon-btn" href="' + rawUrl + '" download title="下载原始文件">' + ico("download", 16) + '</a>' +
        '<a class="icon-btn" href="' + webUrl + '" target="_blank" rel="noopener" title="在 GitHub 中打开">' + ico("external", 16) + '</a>' +
      '</span>' +
    '</div>';
  }

  function filterItems(items) {
    var q = state.query.trim().toLowerCase();
    return items.filter(function (it) {
      if (it.name.charAt(0) === ".") return false;
      if (!q) return true;
      return it.name.toLowerCase().indexOf(q) >= 0;
    });
  }

  function dirCard(name) {
    var items = filterItems(state.dirs[name] || []);
    var total = (state.dirs[name] || []).length;
    var desc = DIR_DESC[name] || "目录资源";
    var rows = items.map(fileRow).join("");
    if (!items.length) {
      rows = '<div class="state-line">没有匹配的文件</div>';
    }
    return '<div class="card">' +
      '<div class="card-head">' +
        '<div class="card-ico">' + ico("folder", 20) + '</div>' +
        '<div><h3>' + escapeHtml(name) + '</h3><div class="cnt">' + escapeHtml(desc) + ' · ' + total + ' 个文件</div></div>' +
      '</div>' +
      '<div class="file-list">' + rows + '</div>' +
    '</div>';
  }

  function releaseAssetRow(a) {
    return '<div class="file-row">' +
      ico("file", 16) +
      '<span class="file-name" title="' + escapeHtml(a.name) + '">' + escapeHtml(a.name) + '</span>' +
      '<span class="file-size">' + fmtSize(a.size) + '</span>' +
      '<span class="file-acts">' +
        '<a class="icon-btn" href="' + a.browser_download_url + '" title="下载">' + ico("download", 16) + '</a>' +
      '</span>' +
    '</div>';
  }

  /* ---------- 视图 ---------- */
  function heroHtml() {
    var m = state.meta || {};
    var desc = m.description || "HGhub 源码备份与配套规则、文档资源。";
    var stars = m.stargazers_count != null ? m.stargazers_count : "—";
    var forks = m.forks_count != null ? m.forks_count : "—";
    var pushed = fmtTime(m.pushed_at);
    return '<section class="hero">' +
      '<div class="hero-top">' +
        '<div>' +
          '<h1>' + escapeHtml(m.name || "study-materials") + '</h1>' +
          '<div class="repo-path">' + escapeHtml(REPO) + '</div>' +
          '<p class="desc">' + escapeHtml(desc) + '</p>' +
        '</div>' +
        '<div class="hero-actions">' +
          '<a class="btn primary" href="https://github.com/' + escapeHtml(REPO) + '" target="_blank" rel="noopener">查看 GitHub 仓库</a>' +
          '<a class="btn" href="https://github.com/' + escapeHtml(REPO) + '/releases" target="_blank" rel="noopener">Releases</a>' +
        '</div>' +
      '</div>' +
      '<div class="meta-row">' +
        '<div class="meta">Star <b>' + stars + '</b></div>' +
        '<div class="meta">Fork <b>' + forks + '</b></div>' +
        (pushed ? '<div class="meta">最近更新 <b>' + pushed + '</b></div>' : '') +
      '</div>' +
    '</section>';
  }

  function releaseBlockHtml(embedded) {
    var r = state.release;
    if (!r) {
      return embedded
        ? '<div class="empty"><div class="t">暂无 Release 版本</div>打 tag 推送后，打包产物会自动出现在这里；当前可在下方分类中直接下载文件。</div>'
        : '<div class="empty"><div class="t">暂无 Release 版本</div>仓库还没有发布 tag 或 Release 资产。完成一次发布后，页面会自动读取最新版本的下载包。</div>';
    }
    var assets = (r.assets || []);
    var body = r.body ? escapeHtml(r.body) : "该版本暂无更新说明。";
    return '<div class="release-banner">' +
      '<div class="release-head">' +
        '<span class="tag-pill">' + escapeHtml(r.tag_name) + '</span>' +
        '<strong>' + escapeHtml(r.name || r.tag_name) + '</strong>' +
        '<span class="release-time">' + fmtTime(r.published_at || r.created_at) + '</span>' +
      '</div>' +
      '<div class="release-body">' + body + '</div>' +
      (assets.length
        ? '<div class="file-list">' + assets.map(releaseAssetRow).join("") + '</div>'
        : '<div class="state-line">该版本暂无附加资产，可从源码归档下载。</div>') +
    '</div>';
  }

  function viewHome() {
    var dirs = SHOW_DIRS.map(dirCard).join("");
    return heroHtml() +
      '<div class="section-title"><h2>发布版本</h2><span class="sub">最新 Release 资产</span></div>' +
      releaseBlockHtml(true) +
      '<div class="section-title"><h2>资源分类</h2><span class="sub">按目录浏览与下载</span></div>' +
      '<div class="grid">' + dirs + '</div>';
  }

  function viewCategories() {
    return '<div class="section-title"><h2>资源分类</h2><span class="sub">rules · docs · public</span></div>' +
      '<div class="grid">' + SHOW_DIRS.map(dirCard).join("") + '</div>';
  }

  function viewRelease() {
    return '<div class="section-title"><h2>发布版本</h2><span class="sub">GitHub Release 下载包</span></div>' +
      releaseBlockHtml(false);
  }

  function render() {
    var html = "";
    if (!state.meta) {
      html = '<div class="state-line">正在加载仓库信息…</div>';
    } else if (state.error) {
      html = '<div class="empty"><div class="t">加载失败</div>' + escapeHtml(state.error) + '，请稍后刷新重试。</div>';
    } else {
      if (state.nav === "categories") html = viewCategories();
      else if (state.nav === "release") html = viewRelease();
      else html = viewHome();
    }
    app.innerHTML = html;
  }

  /* ---------- 事件 ---------- */
  document.getElementById("nav").addEventListener("click", function (e) {
    var btn = e.target.closest(".nav-item");
    if (!btn) return;
    state.nav = btn.dataset.nav;
    Array.prototype.forEach.call(document.querySelectorAll(".nav-item"), function (el) {
      el.classList.toggle("active", el === btn);
    });
    render();
  });

  document.getElementById("searchInput").addEventListener("input", function (e) {
    state.query = e.target.value;
    render();
  });

  /* ---------- 启动 ---------- */
  state.error = null;
  render();
  loadMeta()
    .then(loadRelease)
    .then(loadAllDirs)
    .then(render)
    .catch(function (err) {
      state.error = err && err.message ? err.message : String(err);
      render();
    });
})();
</script>
</body>
</html>
